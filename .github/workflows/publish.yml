name: Publish library
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v0.1.0)
        required: true
        type: string
permissions:
  contents: read
env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: uv sync --frozen
      - name: Check tag matches the reviewed package version
        run: uv run python -c "import os,tomllib; from pathlib import Path; assert os.environ['RELEASE_TAG'].removeprefix('v') == tomllib.loads(Path('pyproject.toml').read_text())['project']['version']"
      - run: uv run pytest
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
