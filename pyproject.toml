[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mygrid-voltbridge"
dynamic = ["version"]
description = "Typed async HTTP client for the MyGrid VoltBridge P1 meter"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "mygrid-voltbridge contributors"}]
keywords = ["mygrid", "voltbridge", "p1", "dsmr", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.10,<4"]

[project.scripts]
mygrid-voltbridge = "mygrid_voltbridge.cli:main"

[project.urls]
Source = "https://github.com/tjorim/python-mygrid-voltbridge"
Issues = "https://github.com/tjorim/python-mygrid-voltbridge/issues"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.17,<0.18",
    "ty>=0.0.90",
    "build>=1.3,<2",
    "twine>=7,<8",
]

[tool.hatch.version]
source = "vcs"
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/mygrid_voltbridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -m 'not live' --strict-markers --strict-config"
markers = ["live: smoke tests against a real device (set VOLTBRIDGE_HOST); excluded from ordinary runs"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mygrid_voltbridge"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN401",
    "COM812",
    "CPY001",
    "D203",
    "D213",
    "E501",
    "ISC001",
    "PLR0913",
    "PLR0917",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ARG001",
    "ARG005",
    "D",
    "INP001",
    "PLC0415",
    "PLR2004",
    "S101",
    "SLF001",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
