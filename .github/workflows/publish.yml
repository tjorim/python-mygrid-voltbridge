name: Publish to PyPI
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0  # hatch-vcs derives the release version from git history and tags
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          python-version: '3.12'
      - run: uv run --locked pytest
      - run: uv build
      - run: uv run --locked twine check dist/*
      - name: Attest built distributions
        uses: astral-sh/attest-action@f589a42a7efb6fe400b4f400de60b4bc90390027
      - name: Publish package to PyPI
        run: uv publish --trusted-publishing always
